<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="TAPX" />
    <meta name="theme-color" content="#09090b" id="theme-color-meta" />
    <link rel="manifest" href="/manifest.json" />
    <title>TAPX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Native iOS Spring Physics */
      .ios-spring {
        transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* iOS Liquid Glass Bar Track (Dark & Light) */
      .ios-glass-bar-dark {
        background: rgba(14, 14, 18, 0.52);
        backdrop-filter: blur(42px) saturate(210%);
        -webkit-backdrop-filter: blur(42px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 0.18),
          inset 0 -0.5px 0.5px rgba(255, 255, 255, 0.05),
          0 20px 50px -8px rgba(0, 0, 0, 0.85);
      }

      .ios-glass-bar-light {
        background: rgba(245, 245, 250, 0.58);
        backdrop-filter: blur(42px) saturate(200%);
        -webkit-backdrop-filter: blur(42px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 0.9),
          inset 0 -0.5px 0.5px rgba(0, 0, 0, 0.05),
          0 16px 40px -8px rgba(0, 0, 0, 0.12);
      }

      /* True Optical Crystal Lens (Dark Mode) — Clear center, refractive Fresnel rim */
      .ios-magnifying-lens-dark {
        background: radial-gradient(
          100% 100% at 50% 50%,
          rgba(255, 255, 255, 0.015) 0%,
          rgba(255, 255, 255, 0.03) 62%,
          rgba(255, 255, 255, 0.12) 92%,
          rgba(255, 255, 255, 0.22) 100%
        );
        backdrop-filter: blur(4px) saturate(260%) brightness(1.16) contrast(1.14);
        -webkit-backdrop-filter: blur(4px) saturate(260%) brightness(1.16) contrast(1.14);
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 0.75),
          inset 0 -1px 0.5px rgba(255, 255, 255, 0.28),
          inset 1.5px 0 3px rgba(130, 210, 255, 0.16),
          inset -1.5px 0 3px rgba(255, 150, 230, 0.12),
          0 10px 28px -4px rgba(0, 0, 0, 0.7);
      }

      /* Razor-thin 1px Diagonal Specular Crystal Rim */
      .ios-magnifying-lens-dark::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.88) 0%,
          rgba(255, 255, 255, 0.12) 32%,
          rgba(255, 255, 255, 0.04) 68%,
          rgba(255, 255, 255, 0.58) 100%
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      /* True Optical Crystal Lens (Light Mode) */
      .ios-magnifying-lens-light {
        background: radial-gradient(
          100% 100% at 50% 50%,
          rgba(255, 255, 255, 0.18) 0%,
          rgba(255, 255, 255, 0.28) 65%,
          rgba(255, 255, 255, 0.68) 94%,
          rgba(255, 255, 255, 0.9) 100%
        );
        backdrop-filter: blur(4px) saturate(240%) brightness(1.05) contrast(1.08);
        -webkit-backdrop-filter: blur(4px) saturate(240%) brightness(1.05) contrast(1.08);
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 1),
          inset 0 -1px 0.5px rgba(255, 255, 255, 0.7),
          inset 1.5px 0 3px rgba(0, 140, 255, 0.1),
          inset -1.5px 0 3px rgba(255, 100, 200, 0.08),
          0 8px 22px -4px rgba(0, 0, 0, 0.14);
      }

      .ios-magnifying-lens-light::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 1) 0%,
          rgba(0, 0, 0, 0.08) 45%,
          rgba(0, 0, 0, 0.04) 65%,
          rgba(255, 255, 255, 0.95) 100%
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      .key-press {
        transition: transform 110ms cubic-bezier(0.2, 0, 0, 1), background-color 110ms ease;
        will-change: transform;
      }
      .key-press:active {
        transform: scale(0.92);
      }

      /* Directional Tab Transitions */
      @keyframes tabSlideRight {
        0% {
          opacity: 0;
          transform: translate3d(22px, 0, 0) scale(0.985);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes tabSlideLeft {
        0% {
          opacity: 0;
          transform: translate3d(-22px, 0, 0) scale(0.985);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes tabFadeUp {
        0% {
          opacity: 0;
          transform: translate3d(0, 10px, 0) scale(0.99);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      .animate-tab-right {
        animation: tabSlideRight 320ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }

      .animate-tab-left {
        animation: tabSlideLeft 320ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }

      .animate-tab {
        animation: tabFadeUp 260ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }

      @keyframes amountPop {
        0% {
          transform: scale(0.95);
        }
        60% {
          transform: scale(1.02);
        }
        100% {
          transform: scale(1);
        }
      }
      .animate-pop {
        animation: amountPop 160ms cubic-bezier(0.22, 1, 0.36, 1);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
