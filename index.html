<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="TAPX" />
    <meta name="theme-color" content="#09090b" id="theme-color-meta" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" id="ios-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>TAPX</title>
    <script>
      // Synchronously generate a 512x512 PNG for iOS Home Screen (Safari requires PNG for apple-touch-icon)
      (function () {
        try {
          var c = document.createElement('canvas');
          c.width = 512;
          c.height = 512;
          var ctx = c.getContext('2d');

          function roundRectPath(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
          }

          // 1. Dark iOS App Icon Background (#09090b - no white box)
          ctx.fillStyle = '#09090b';
          ctx.fillRect(0, 0, 512, 512);

          // Center the logo artwork nicely inside the 512x512 icon grid
          ctx.save();
          ctx.translate(-6, 4);

          // 2. Rising Bar Chart (Emerald, Teal, Blue)
          var g1 = ctx.createLinearGradient(0, 148, 0, 260);
          g1.addColorStop(0, '#10b981');
          g1.addColorStop(1, '#059669');
          ctx.fillStyle = g1;
          roundRectPath(172, 148, 54, 112, 6);
          ctx.fill();

          var g2 = ctx.createLinearGradient(0, 110, 0, 260);
          g2.addColorStop(0, '#2dd4bf');
          g2.addColorStop(1, '#0d9488');
          ctx.fillStyle = g2;
          roundRectPath(242, 110, 54, 150, 6);
          ctx.fill();

          var g3 = ctx.createLinearGradient(0, 70, 0, 260);
          g3.addColorStop(0, '#38bdf8');
          g3.addColorStop(1, '#2563eb');
          ctx.fillStyle = g3;
          roundRectPath(312, 70, 54, 190, 6);
          ctx.fill();

          // 3. Wallet Top-Left Lip
          var navyGrad = ctx.createLinearGradient(100, 214, 416, 440);
          navyGrad.addColorStop(0, '#163e7a');
          navyGrad.addColorStop(1, '#0a2347');
          ctx.fillStyle = navyGrad;
          roundRectPath(100, 214, 78, 84, 38);
          ctx.fill();

          // 4. Wallet Main Body (Clipped for Internal Teal & Emerald Waves)
          ctx.save();
          roundRectPath(100, 256, 316, 184, 42);
          ctx.clip();

          ctx.fillStyle = navyGrad;
          ctx.fillRect(100, 256, 316, 184);

          // Mid Teal Wave
          ctx.fillStyle = '#0e7c86';
          ctx.beginPath();
          ctx.moveTo(226, 256);
          ctx.lineTo(416, 256);
          ctx.lineTo(416, 440);
          ctx.lineTo(314, 440);
          ctx.bezierCurveTo(264, 410, 236, 344, 226, 256);
          ctx.closePath();
          ctx.fill();

          // Right Emerald Wave
          ctx.fillStyle = '#15a378';
          ctx.beginPath();
          ctx.moveTo(296, 256);
          ctx.lineTo(416, 256);
          ctx.lineTo(416, 440);
          ctx.lineTo(338, 440);
          ctx.bezierCurveTo(304, 408, 292, 336, 296, 256);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          // 5. Cutouts (Top Wallet Fold Slot & Center Arch Ring)
          ctx.fillStyle = '#09090b';
          roundRectPath(130, 236, 180, 22, 11);
          ctx.fill();

          ctx.beginPath();
          ctx.arc(298, 258, 58, 0, Math.PI * 2);
          ctx.fill();

          // 6. Center Emerald Arch Swoop
          ctx.fillStyle = '#15a378';
          ctx.beginPath();
          ctx.arc(298, 258, 44, Math.PI, 0, false);
          ctx.bezierCurveTo(342, 332, 326, 398, 338, 440);
          ctx.lineTo(312, 440);
          ctx.bezierCurveTo(274, 406, 254, 334, 254, 258);
          ctx.closePath();
          ctx.fill();

          // Inner Arch Accent Curve
          ctx.strokeStyle = '#0a5c4c';
          ctx.lineWidth = 7;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.arc(298, 258, 28, Math.PI * 1.15, Math.PI * 1.85, false);
          ctx.stroke();

          // 7. Clasp Surround Cutout
          ctx.fillStyle = '#09090b';
          roundRectPath(312, 312, 124, 84, 42);
          ctx.fill();

          // 8. Navy Wallet Clasp & Button Dot
          ctx.fillStyle = navyGrad;
          roundRectPath(328, 328, 96, 52, 26);
          ctx.fill();

          ctx.fillStyle = '#09090b';
          ctx.beginPath();
          ctx.arc(358, 354, 12, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();

          var pngDataUrl = c.toDataURL('image/png');
          var iconLink = document.getElementById('ios-touch-icon');
          if (iconLink) iconLink.setAttribute('href', pngDataUrl);
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Native iOS Spring Physics */
      .ios-spring {
        transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* iOS Liquid Glass Bar Track (Dark & Light) */
      .ios-glass-bar-dark {
        background: rgba(14, 14, 18, 0.52);
        backdrop-filter: blur(42px) saturate(210%);
        -webkit-backdrop-filter: blur(42px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.09);
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 0.18),
          inset 0 -0.5px 0.5px rgba(255, 255, 255, 0.05),
          0 20px 50px -8px rgba(0, 0, 0, 0.85);
      }

      .ios-glass-bar-light {
        background: rgba(245, 245, 250, 0.58);
        backdrop-filter: blur(42px) saturate(200%);
        -webkit-backdrop-filter: blur(42px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 0.9),
          inset 0 -0.5px 0.5px rgba(0, 0, 0, 0.05),
          0 16px 40px -8px rgba(0, 0, 0, 0.12);
      }

      /* True Optical Crystal Lens (Dark Mode) — Clear center, refractive Fresnel rim */
      .ios-magnifying-lens-dark {
        background: radial-gradient(
          100% 100% at 50% 50%,
          rgba(255, 255, 255, 0.015) 0%,
          rgba(255, 255, 255, 0.03) 62%,
          rgba(255, 255, 255, 0.12) 92%,
          rgba(255, 255, 255, 0.22) 100%
        );
        backdrop-filter: blur(4px) saturate(260%) brightness(1.16) contrast(1.14);
        -webkit-backdrop-filter: blur(4px) saturate(260%) brightness(1.16) contrast(1.14);
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 0.75),
          inset 0 -1px 0.5px rgba(255, 255, 255, 0.28),
          inset 1.5px 0 3px rgba(130, 210, 255, 0.16),
          inset -1.5px 0 3px rgba(255, 150, 230, 0.12),
          0 10px 28px -4px rgba(0, 0, 0, 0.7);
      }

      /* Razor-thin 1px Diagonal Specular Crystal Rim */
      .ios-magnifying-lens-dark::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.88) 0%,
          rgba(255, 255, 255, 0.12) 32%,
          rgba(255, 255, 255, 0.04) 68%,
          rgba(255, 255, 255, 0.58) 100%
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      /* True Optical Crystal Lens (Light Mode) */
      .ios-magnifying-lens-light {
        background: radial-gradient(
          100% 100% at 50% 50%,
          rgba(255, 255, 255, 0.18) 0%,
          rgba(255, 255, 255, 0.28) 65%,
          rgba(255, 255, 255, 0.68) 94%,
          rgba(255, 255, 255, 0.9) 100%
        );
        backdrop-filter: blur(4px) saturate(240%) brightness(1.05) contrast(1.08);
        -webkit-backdrop-filter: blur(4px) saturate(240%) brightness(1.05) contrast(1.08);
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 1),
          inset 0 -1px 0.5px rgba(255, 255, 255, 0.7),
          inset 1.5px 0 3px rgba(0, 140, 255, 0.1),
          inset -1.5px 0 3px rgba(255, 100, 200, 0.08),
          0 8px 22px -4px rgba(0, 0, 0, 0.14);
      }

      .ios-magnifying-lens-light::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 1) 0%,
          rgba(0, 0, 0, 0.08) 45%,
          rgba(0, 0, 0, 0.04) 65%,
          rgba(255, 255, 255, 0.95) 100%
        );
        -webkit-mask:
          linear-gradient(#fff 0 0) content-box,
          linear-gradient(#fff 0 0);
        -webkit-mask-composite: xor;
        mask-composite: exclude;
        pointer-events: none;
      }

      .key-press {
        transition: transform 110ms cubic-bezier(0.2, 0, 0, 1), background-color 110ms ease;
        will-change: transform;
      }
      .key-press:active {
        transform: scale(0.92);
      }

      /* Directional Tab Transitions */
      @keyframes tabSlideRight {
        0% {
          opacity: 0;
          transform: translate3d(22px, 0, 0) scale(0.985);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes tabSlideLeft {
        0% {
          opacity: 0;
          transform: translate3d(-22px, 0, 0) scale(0.985);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes tabFadeUp {
        0% {
          opacity: 0;
          transform: translate3d(0, 10px, 0) scale(0.99);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      .animate-tab-right {
        animation: tabSlideRight 320ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }

      .animate-tab-left {
        animation: tabSlideLeft 320ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }

      .animate-tab {
        animation: tabFadeUp 260ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }

      @keyframes amountPop {
        0% {
          transform: scale(0.95);
        }
        60% {
          transform: scale(1.02);
        }
        100% {
          transform: scale(1);
        }
      }
      .animate-pop {
        animation: amountPop 160ms cubic-bezier(0.22, 1, 0.36, 1);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
