<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="TAPX" />
    <meta name="theme-color" content="#09090b" id="theme-color-meta" />
    <link rel="manifest" href="/manifest.json" />
    <title>TAPX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Native iOS Spring Physics */
      .ios-spring {
        transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* iOS Liquid Glass Bar Surface (Dark & Light) */
      .ios-glass-bar-dark {
        background: rgba(20, 20, 25, 0.72);
        backdrop-filter: blur(36px) saturate(210%);
        -webkit-backdrop-filter: blur(36px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 0.22),
          inset 0 -0.5px 0.5px rgba(255, 255, 255, 0.06),
          0 22px 48px -6px rgba(0, 0, 0, 0.88);
      }

      .ios-glass-bar-light {
        background: rgba(244, 244, 249, 0.74);
        backdrop-filter: blur(36px) saturate(200%);
        -webkit-backdrop-filter: blur(36px) saturate(200%);
        border: 1px solid rgba(0, 0, 0, 0.07);
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 0.95),
          inset 0 -0.5px 0.5px rgba(0, 0, 0, 0.04),
          0 18px 40px -6px rgba(0, 0, 0, 0.15);
      }

      /* Convex Magnifying Glass Lens (Dark Mode) */
      .ios-magnifying-lens-dark {
        background:
          radial-gradient(
            120% 100% at 50% 12%,
            rgba(255, 255, 255, 0.34) 0%,
            rgba(255, 255, 255, 0.14) 48%,
            rgba(255, 255, 255, 0.06) 78%,
            rgba(255, 255, 255, 0.18) 100%
          );
        backdrop-filter: blur(16px) saturate(240%) brightness(1.22) contrast(1.08);
        -webkit-backdrop-filter: blur(16px) saturate(240%) brightness(1.22) contrast(1.08);
        border: 1px solid rgba(255, 255, 255, 0.34);
        box-shadow:
          inset 0 1.5px 1px rgba(255, 255, 255, 0.65),
          inset 0 -1.5px 2px rgba(255, 255, 255, 0.22),
          inset 0 0 14px rgba(255, 255, 255, 0.12),
          0 8px 24px -2px rgba(0, 0, 0, 0.65),
          0 0 18px rgba(255, 255, 255, 0.08);
      }

      /* Convex Magnifying Glass Lens (Light Mode) */
      .ios-magnifying-lens-light {
        background:
          radial-gradient(
            120% 100% at 50% 10%,
            rgba(255, 255, 255, 0.98) 0%,
            rgba(255, 255, 255, 0.82) 52%,
            rgba(245, 247, 255, 0.92) 100%
          );
        backdrop-filter: blur(16px) saturate(220%) brightness(1.06);
        -webkit-backdrop-filter: blur(16px) saturate(220%) brightness(1.06);
        border: 1px solid rgba(255, 255, 255, 0.95);
        box-shadow:
          inset 0 2px 1.5px rgba(255, 255, 255, 1),
          inset 0 -1.5px 2px rgba(0, 122, 255, 0.12),
          0 10px 26px -4px rgba(0, 0, 0, 0.18),
          0 2px 8px rgba(0, 122, 255, 0.08);
      }

      /* Specular Top Glare Arc inside the Magnifying Bubble */
      .ios-lens-glare {
        position: absolute;
        top: 2px;
        left: 14%;
        right: 14%;
        height: 38%;
        border-radius: 9999px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.42) 0%,
          rgba(255, 255, 255, 0) 100%
        );
        pointer-events: none;
      }

      .key-press {
        transition: transform 110ms cubic-bezier(0.2, 0, 0, 1), background-color 110ms ease;
        will-change: transform;
      }
      .key-press:active {
        transform: scale(0.92);
      }

      /* Directional Tab Transitions */
      @keyframes tabSlideRight {
        0% {
          opacity: 0;
          transform: translate3d(22px, 0, 0) scale(0.985);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes tabSlideLeft {
        0% {
          opacity: 0;
          transform: translate3d(-22px, 0, 0) scale(0.985);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes tabFadeUp {
        0% {
          opacity: 0;
          transform: translate3d(0, 10px, 0) scale(0.99);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      .animate-tab-right {
        animation: tabSlideRight 320ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }

      .animate-tab-left {
        animation: tabSlideLeft 320ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }

      .animate-tab {
        animation: tabFadeUp 260ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }

      @keyframes amountPop {
        0% {
          transform: scale(0.95);
        }
        60% {
          transform: scale(1.02);
        }
        100% {
          transform: scale(1);
        }
      }
      .animate-pop {
        animation: amountPop 160ms cubic-bezier(0.22, 1, 0.36, 1);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
