<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" id="apple-status-bar-meta" />
    <meta name="apple-mobile-web-app-title" content="TAPX" />
    <meta name="theme-color" content="#1e1e1c" id="theme-color-meta" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" id="ios-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>TAPX</title>
    <script>
      // 1. Synchronously sync root background, color-scheme & theme-color before first paint
      (function () {
        try {
          var savedTheme = localStorage.getItem('tapx_theme_pref') || 'dark';
          var sysDark = window.matchMedia
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : true;
          var isDark = savedTheme === 'system' ? sysDark : savedTheme === 'dark';
          var bgHex = isDark ? '#1e1e1c' : '#EFE7DA';

          document.documentElement.style.backgroundColor = bgHex;
          document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';

          var oldMeta = document.getElementById('theme-color-meta');
          if (oldMeta) oldMeta.remove();
          var freshMeta = document.createElement('meta');
          freshMeta.id = 'theme-color-meta';
          freshMeta.name = 'theme-color';
          freshMeta.content = bgHex;
          document.head.appendChild(freshMeta);

          var statusMeta = document.getElementById('apple-status-bar-meta');
          if (statusMeta) {
            statusMeta.setAttribute('content', isDark ? 'black-translucent' : 'default');
          }
        } catch (e) {}
      })();

      // 2. Synchronously generate a 512x512 Cartoony Charcoal & Sand PNG for iOS Home Screen
      (function () {
        try {
          var c = document.createElement('canvas');
          c.width = 512;
          c.height = 512;
          var ctx = c.getContext('2d');

          function roundRectPath(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
          }

          // Warm Charcoal App Icon Background (#1e1e1c)
          ctx.fillStyle = '#1e1e1c';
          ctx.fillRect(0, 0, 512, 512);

          ctx.save();
          ctx.translate(-4, 8);

          // Hard Cartoon Drop Shadow Behind Wallet
          ctx.fillStyle = '#111110';
          roundRectPath(106, 224, 316, 224, 46);
          ctx.fill();

          // Rising Chunky Cartoon Bars (Coral, Mint, Gold) with Dark Outlines
          var bars = [
            { x: 168, y: 146, w: 56, h: 120, color: '#F26B5B' },
            { x: 240, y: 108, w: 56, h: 158, color: '#52B788' },
            { x: 312, y: 68, w: 56, h: 198, color: '#F4B942' }
          ];
          bars.forEach(function (b) {
            ctx.fillStyle = b.color;
            roundRectPath(b.x, b.y, b.w, b.h, 14);
            ctx.fill();
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#111110';
            ctx.stroke();
          });

          // Main Wallet Body in Warm Sand (#D8CBB3)
          ctx.fillStyle = '#D8CBB3';
          roundRectPath(100, 216, 316, 218, 44);
          ctx.fill();
          ctx.lineWidth = 10;
          ctx.strokeStyle = '#111110';
          ctx.stroke();

          // Wallet Clasp in Charcoal (#2a2a27) with Gold Button Dot
          ctx.fillStyle = '#2a2a27';
          roundRectPath(324, 298, 102, 64, 32);
          ctx.fill();
          ctx.lineWidth = 9;
          ctx.strokeStyle = '#111110';
          ctx.stroke();

          ctx.fillStyle = '#F4B942';
          ctx.beginPath();
          ctx.arc(358, 330, 13, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#111110';
          ctx.stroke();

          ctx.restore();

          var pngDataUrl = c.toDataURL('image/png');
          var iconLink = document.getElementById('ios-touch-icon');
          if (iconLink) iconLink.setAttribute('href', pngDataUrl);
        } catch (e) {}
      })();
    </script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        box-sizing: border-box;
      }
      :root,
      html {
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background-color: #1e1e1c;
      }
      body,
      #root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        background-color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
