<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="TAPX" />
    <meta name="theme-color" content="#1e1e1c" id="theme-color-meta" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" id="ios-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>TAPX</title>
    <script>
      (function () {
        try {
          var c = document.createElement('canvas');
          c.width = 512;
          c.height = 512;
          var ctx = c.getContext('2d');

          function roundRectPath(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
          }

          ctx.fillStyle = '#1e1e1c';
          ctx.fillRect(0, 0, 512, 512);

          ctx.save();
          ctx.translate(-4, 8);

          ctx.fillStyle = '#111110';
          roundRectPath(106, 224, 316, 224, 46);
          ctx.fill();

          var bars = [
            { x: 168, y: 146, w: 56, h: 120, color: '#F26B5B' },
            { x: 240, y: 108, w: 56, h: 158, color: '#52B788' },
            { x: 312, y: 68, w: 56, h: 198, color: '#F4B942' }
          ];
          bars.forEach(function (b) {
            ctx.fillStyle = b.color;
            roundRectPath(b.x, b.y, b.w, b.h, 14);
            ctx.fill();
            ctx.lineWidth = 8;
            ctx.strokeStyle = '#111110';
            ctx.stroke();
          });

          ctx.fillStyle = '#D8CBB3';
          roundRectPath(100, 216, 316, 218, 44);
          ctx.fill();
          ctx.lineWidth = 10;
          ctx.strokeStyle = '#111110';
          ctx.stroke();

          ctx.fillStyle = '#2a2a27';
          roundRectPath(324, 298, 102, 64, 32);
          ctx.fill();
          ctx.lineWidth = 9;
          ctx.strokeStyle = '#111110';
          ctx.stroke();

          ctx.fillStyle = '#F4B942';
          ctx.beginPath();
          ctx.arc(358, 330, 13, 0, Math.PI * 2);
          ctx.fill();
          ctx.lineWidth = 6;
          ctx.strokeStyle = '#111110';
          ctx.stroke();

          ctx.restore();

          var pngDataUrl = c.toDataURL('image/png');
          var iconLink = document.getElementById('ios-touch-icon');
          if (iconLink) iconLink.setAttribute('href', pngDataUrl);
        } catch (e) {}
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        font-family: 'Plus Jakarta Sans', ui-rounded, 'SF Pro Rounded', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .font-cartoon {
        font-family: 'Fredoka', ui-rounded, 'SF Pro Rounded', 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      .ios-spring {
        transition-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .cartoon-dock-dark {
        background: #282825;
        border: 2.5px solid #111110;
        box-shadow:
          inset 0 2px 0 rgba(216, 203, 179, 0.14),
          0 5px 0 #111110,
          0 12px 24px rgba(0, 0, 0, 0.5);
      }

      .cartoon-dock-light {
        background: #FAF6EE;
        border: 2.5px solid #1e1e1c;
        box-shadow:
          inset 0 2px 0 #ffffff,
          0 5px 0 #1e1e1c,
          0 10px 20px rgba(30, 30, 28, 0.14);
      }

      .cartoon-pill-lens-dark {
        background: #D8CBB3;
        border: 2px solid #111110;
        box-shadow:
          inset 0 2px 0 rgba(255, 255, 255, 0.45),
          0 3px 0 #111110;
      }

      .cartoon-pill-lens-light {
        background: #1e1e1c;
        border: 2px solid #1e1e1c;
        box-shadow:
          inset 0 1.5px 0 rgba(255, 255, 255, 0.2),
          0 3px 0 #877D6E;
      }

      .key-press {
        transition:
          transform 95ms cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 95ms cubic-bezier(0.34, 1.56, 0.64, 1),
          background-color 110ms ease;
        will-change: transform, box-shadow;
      }
      .key-press:active {
        transform: translate3d(0, 3px, 0) scale(0.97);
      }

      @keyframes tabSlideRight {
        0% {
          opacity: 0;
          transform: translate3d(24px, 0, 0) scale(0.97);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes tabSlideLeft {
        0% {
          opacity: 0;
          transform: translate3d(-24px, 0, 0) scale(0.97);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes tabFadeUp {
        0% {
          opacity: 0;
          transform: translate3d(0, 12px, 0) scale(0.96);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      .animate-tab-right {
        animation: tabSlideRight 300ms cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
        will-change: transform, opacity;
      }

      .animate-tab-left {
        animation: tabSlideLeft 300ms cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
        will-change: transform, opacity;
      }

      .animate-tab {
        animation: tabFadeUp 260ms cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
