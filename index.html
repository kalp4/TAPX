<!DOCTYPE html>
<html lang="en" style="background-color: #1e1e1c;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="TAPX" />
    <meta name="theme-color" content="#1e1e1c" id="theme-color-meta" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" id="ios-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>TAPX</title>
    <script>
      // Synchronously set root background & theme-color before first paint so iOS status bar is never white
      (function () {
        try {
          var savedTheme = localStorage.getItem('tapx_theme_pref') || 'dark';
          var sysDark = window.matchMedia
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : true;
          var isDark = savedTheme === 'system' ? sysDark : savedTheme === 'dark';
          var bgHex = isDark ? '#1e1e1c' : '#EFE7DA';
          document.documentElement.style.backgroundColor = bgHex;
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', bgHex);
        } catch (e) {}
      })();
    </script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        box-sizing: border-box;
      }
      :root,
      html {
        width: 100%;
        height: 100dvh;
        min-height: 100%;
        margin: 0;
        padding: 0;
        background-color: #1e1e1c;
      }
      body,
      #root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100dvh;
        min-height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        background-color: #1e1e1c;
      }
    </style>
  </head>
  <body style="background-color: #1e1e1c;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
