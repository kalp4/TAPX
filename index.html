<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="TAPX" />
    <meta name="theme-color" content="#09090b" id="theme-color-meta" />
    <link rel="manifest" href="/manifest.json" />
    <title>TAPX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      /* Native iOS Spring Physics */
      .ios-spring {
        transition-timing-function: cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* iOS Liquid Glass Tab Lens Spring (subtle elastic overshoot) */
      .ios-liquid-spring {
        transition: transform 440ms cubic-bezier(0.26, 1.16, 0.38, 1);
        will-change: transform;
      }

      /* iOS Liquid Glass Bar Surface (Dark & Light) */
      .ios-glass-bar-dark {
        background: rgba(24, 24, 29, 0.72);
        backdrop-filter: blur(34px) saturate(210%);
        -webkit-backdrop-filter: blur(34px) saturate(210%);
        border: 1px solid rgba(255, 255, 255, 0.13);
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 0.26),
          inset 0 -0.5px 0.5px rgba(255, 255, 255, 0.08),
          0 20px 44px -6px rgba(0, 0, 0, 0.82);
      }

      .ios-glass-bar-light {
        background: rgba(248, 248, 252, 0.76);
        backdrop-filter: blur(34px) saturate(200%);
        -webkit-backdrop-filter: blur(34px) saturate(200%);
        border: 1px solid rgba(0, 0, 0, 0.07);
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 0.95),
          inset 0 -0.5px 0.5px rgba(0, 0, 0, 0.04),
          0 16px 38px -6px rgba(0, 0, 0, 0.14);
      }

      /* iOS Liquid Glass Active Pill Lens */
      .ios-glass-lens-dark {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.19) 0%,
          rgba(255, 255, 255, 0.10) 100%
        );
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 0.42),
          inset 0 -0.5px 0.5px rgba(255, 255, 255, 0.12),
          0 4px 14px rgba(0, 0, 0, 0.38);
      }

      .ios-glass-lens-light {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.96) 0%,
          rgba(240, 240, 245, 0.88) 100%
        );
        box-shadow:
          inset 0 1px 0.5px rgba(255, 255, 255, 1),
          0 3px 12px rgba(0, 0, 0, 0.09);
      }

      .key-press {
        transition: transform 110ms cubic-bezier(0.2, 0, 0, 1), background-color 110ms ease;
        will-change: transform;
      }
      .key-press:active {
        transform: scale(0.92);
      }

      /* Directional Tab Transitions */
      @keyframes tabSlideRight {
        0% {
          opacity: 0;
          transform: translate3d(22px, 0, 0) scale(0.985);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes tabSlideLeft {
        0% {
          opacity: 0;
          transform: translate3d(-22px, 0, 0) scale(0.985);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      @keyframes tabFadeUp {
        0% {
          opacity: 0;
          transform: translate3d(0, 10px, 0) scale(0.99);
        }
        100% {
          opacity: 1;
          transform: translate3d(0, 0, 0) scale(1);
        }
      }

      .animate-tab-right {
        animation: tabSlideRight 320ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }

      .animate-tab-left {
        animation: tabSlideLeft 320ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }

      .animate-tab {
        animation: tabFadeUp 260ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }

      @keyframes amountPop {
        0% {
          transform: scale(0.95);
        }
        60% {
          transform: scale(1.02);
        }
        100% {
          transform: scale(1);
        }
      }
      .animate-pop {
        animation: amountPop 160ms cubic-bezier(0.22, 1, 0.36, 1);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
